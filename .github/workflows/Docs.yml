name: Docs
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/knottyanyon/qritical-docs:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      actions: write
      contents: write
      statuses: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Fix workspace ownership for git
        run: chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE"

      - name: Instantiate and precompile
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using Qritical
          using HalfIntegers
          DocMeta.setdocmeta!(Qritical, :DocTestSetup, :(using Qritical; using HalfIntegers); recursive=true)
          doctest(Qritical)