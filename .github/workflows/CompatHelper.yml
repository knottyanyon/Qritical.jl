name: CompatHelper

on:
  schedule:
    - cron: "0 0 1,15 * *"   # runs on the 1st and 15th of each month
  workflow_dispatch:

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/CompatHelper.jl@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
