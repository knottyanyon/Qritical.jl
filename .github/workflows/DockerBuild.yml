name: Build Docs Image
on:
  push:
    branches: [main]
    paths:
      - Project.toml
      - Manifest.toml
      - docs/Project.toml
      - docker/docs/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docs/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qritical-docs:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/qritical-docs:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/qritical-docs:buildcache,mode=max
