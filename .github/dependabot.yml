# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  # GitHub Actions — weekly, all bumps in one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Root Julia project — monthly, all bumps in one PR
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      julia-deps:
        patterns:
          - "*"

  # Docs Julia project — monthly, all bumps in one PR
  - package-ecosystem: "julia"
    directory: "/docs"
    schedule:
      interval: "monthly"
    groups:
      julia-docs-deps:
        patterns:
          - "*"
